*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;color:#2c2c2a;padding:20px}
h1{font-size:20px;font-weight:500;margin-bottom:4px}
.updated{font-size:12px;color:#888;margin-bottom:20px}
.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid #e0e0dc;border-radius:10px;padding:14px;text-align:center}
.stat-label{font-size:12px;color:#888;margin-bottom:6px}
.stat-num{font-size:24px;font-weight:500}

.card-title{font-size:13px;font-weight:500;color:#888;margin-bottom:12px}
.bar-legend{display:flex;flex-wrap:wrap;gap:10px}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:#666}
.leg-dot{width:9px;height:9px;border-radius:50%}
/* 도넛 */
.ring-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.ring-item{text-align:center}
.ring-name{font-size:12px;font-weight:500;color:#333;margin-top:2px}
.ring-tot{font-size:11px;color:#999}
/* 이번주 입고예정 */
.week-box{background:#faf9f7;border-radius:10px;padding:12px 14px;margin-bottom:12px}
.week-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:13px;color:#333}
.week-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.wcell{cursor:pointer;text-align:center;padding:8px 0;background:#fff;border-radius:6px;border:1px solid #e8e8e4}
.wcell:hover{background:#f5f5f3}
.wcell.on{background:#E8F1FB;border:1.5px solid #378ADD}
.wcell .wd{font-size:11px;color:#999}
.wcell.on .wd{color:#185FA5;font-weight:500}
.wcell .wn{font-size:18px;font-weight:500;color:#333}
.wcell.on .wn{color:#185FA5}
/* 요일 패널 */
.day-panel{border:1px solid #378ADD;border-radius:10px;padding:12px 16px;margin-bottom:14px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;flex-wrap:wrap;gap:8px}
.drow{display:flex;justify-content:space-between;padding:5px 8px;border-bottom:1px solid #f0efeb;font-size:13px;border-radius:4px}
.drow:last-child{border-bottom:none}
.drow-clickable{cursor:pointer;transition:background .12s}
.drow-clickable:hover{background:#f0f7ff;color:#185FA5}
/* 월별 */
.month-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.mcrd{border:1px solid #e0e0dc;border-radius:8px;padding:10px}
.mtitle{font-size:12px;font-weight:500}
.mtitle-row{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid #eee}
.mtot-num{font-size:14px;font-weight:500;color:#185FA5}
.mrow{font-size:11px;color:#888;display:flex;justify-content:space-between;padding:2px 0}
.mrow b{color:#333}
/* 필터/테이블 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.filters select,.filters input{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#333}
.filters input{width:180px}
.count-info{font-size:12px;color:#888;margin-bottom:8px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:900px}
th{font-size:11px;font-weight:500;color:#888;text-align:left;padding:7px 8px;border-bottom:1px solid #e8e8e4;white-space:nowrap;background:#faf9f7;cursor:pointer}
th:hover{background:#f0efeb}
td{padding:6px 8px;border-bottom:1px solid #f0efeb;vertical-align:middle}
tr:hover td{background:#faf9f7}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-done{background:#EAF3DE;color:#27500A}
.b-order{background:#E6F1FB;color:#0C447C}
.b-swait{background:#FAEEDA;color:#633806}
.b-pending{background:#F1EFE8;color:#444}
.pager{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:12px;color:#888}
.pager button{padding:4px 12px;font-size:12px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#333;cursor:pointer}
.pager button:hover{background:#f5f5f3}
.error-box{background:#fff3f3;border:1px solid #f5c6c6;border-radius:8px;padding:12px;margin-bottom:16px;font-size:13px;color:#a33}
.dd-urgent{color:#c0392b;font-weight:500}
.dd-soon{color:#e67e22;font-weight:500}
</style>

// ===== 이번주 입고예정 (월~토) + 요일 패널 =====
const DOW=["일","월","화","수","목","금","토"];
function pad(n){return n<10?"0"+n:""+n;}
function fmt(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function weekDates(){
  const t=new Date(); t.setHours(0,0,0,0);
  const off=(t.getDay()+6)%7;           // 월=0
  const mon=new Date(t); mon.setDate(t.getDate()-off);
  const a=[];
  // 이번주 월~토 (0~5)
  for(let i=0;i<6;i++){const d=new Date(mon); d.setDate(mon.getDate()+i); a.push(d);}
  // 다음주 월~토 (6~11) - 일요일 건너뛰고 +7부터
  for(let i=7;i<13;i++){const d=new Date(mon); d.setDate(mon.getDate()+i); a.push(d);}
  return a;
}
const WK=weekDates(), TODAY=fmt(new Date());
let SEL=0; WK.forEach((d,i)=>{if(fmt(d)===TODAY)SEL=i;});
function dayTotal(key){const o=DAILY[key]||{};return Object.values(o).reduce((a,b)=>a+b,0);}

function buildWeek(){
  function renderBlock(start, end, title){
    let sum=0, cells="";
    for(let i=start;i<end;i++){
      const d=WK[i], key=fmt(d), tot=dayTotal(key), isT=key===TODAY;
      sum+=tot;
      const lbl=DOW[d.getDay()]+" "+(d.getMonth()+1)+"/"+d.getDate()+(isT?" ·오늘":"");
      cells += `<div class="wcell ${i===SEL?'on':''}" onclick="pickDay(${i})"><div class="wd">${lbl}</div><div class="wn">${tot}</div></div>`;
    }
    const r0=WK[start], r1=WK[end-1];
    const range=`(${r0.getMonth()+1}/${r0.getDate()}~${r1.getMonth()+1}/${r1.getDate()})`;
    return `<div class="week-head"><span><b>${title}</b> <span style="color:#999;font-weight:400">${range}</span></span><span style="color:#666">합계 ${sum}건</span></div><div class="week-row">${cells}</div>`;
  }
  document.getElementById("week-content").innerHTML =
    renderBlock(0, 6, "이번주 입고예정")
    + `<div style="height:12px"></div>`
    + renderBlock(6, 12, "다음주 입고예정");
}

function buildDay(){
  const d=WK[SEL], key=fmt(d), o=DAILY[key]||{}, tot=dayTotal(key), isT=key===TODAY;
  let rows;
  if(tot===0){
    rows=`<div class="drow" style="color:#999;justify-content:center">입고예정 없음</div>`;
  } else {
    rows=PORDER.map(p=>{
      const v=o[p]||0;
      if(v>0){
        return `<div class="drow drow-clickable" onclick="applyDayProjFilter('${key}','${p}')" title="클릭하면 ${p} ${v}건만 보기"><span style="color:#666">${p}</span><span style="font-weight:500;color:#185FA5">${v}건 →</span></div>`;
      } else {
        return `<div class="drow"><span style="color:#666">${p}</span><span style="color:#bbb">${v}건</span></div>`;
      }
    }).join("");
  }
  const btn = tot>0
    ? `<button onclick="applyDayFilter()" style="font-size:12px;font-weight:500;padding:4px 12px;border-radius:999px;border:1px solid #378ADD;background:#E8F1FB;color:#185FA5;cursor:pointer">📋 이 날짜 전체 보기</button>`
    : "";
  document.getElementById("day-panel").innerHTML=
    `<div class="day-head"><span style="font-weight:500;color:#185FA5">${d.getMonth()+1}/${d.getDate()} (${DOW[d.getDay()]}) 입고예정${isT?' · 오늘':''}</span><span style="display:flex;align-items:center;gap:10px"><span style="color:#666;font-size:12px">합계 ${tot}건</span>${btn}</span></div>${rows}`;
}
function pickDay(i){SEL=i;buildWeek();buildDay();}

function badge(s){
  const m={"입고완료":"b-done","재고(사용가능)":"b-done","발주완료":"b-order","재고(창고대기)":"b-swait","발주예정":"b-pending"};
  const label={"재고(사용가능)":"입고완료 (재고)","발주완료":"발주완료(입고예정)"};
  return`<span class="badge ${m[s]||"b-pending"}">${label[s]||s}</span>`;
}

function ddColor(dd, status){
  // 입고완료 상태: 날짜가 있으면 표시, 없으면 "입고완료"만
  if(status === "입고완료" || status === "재고(사용가능)") {
    if(dd && dd.match(/\d{4}-\d{2}-\d{2}/)) 
      return `<span style="color:#3B6D11;font-weight:500">${dd} ✅</span>`;
    return `<span style="color:#3B6D11;font-weight:500">✅ 입고완료</span>`;
  }
  // 발주 상태: 예정일 기준 D-day 계산
  if(!dd||!dd.match(/\d{4}-\d{2}-\d{2}/)) return dd||"-";
  const today=new Date(); today.setHours(0,0,0,0);
  const d=new Date(dd); d.setHours(0,0,0,0);
  const diff=Math.round((d-today)/(1000*60*60*24));
  if(diff < 0)   return `<span style="color:#fff;background:#C0392B;padding:2px 8px;border-radius:6px;font-weight:500">${dd} ⚠️ ${-diff}일 지연</span>`;
  if(diff === 0) return `<span style="color:#fff;background:#185FA5;padding:2px 8px;border-radius:6px;font-weight:500">${dd} D-DAY</span>`;
  if(diff<=7)    return `<span class="dd-urgent">${dd} (D-${diff})</span>`;
  if(diff<=30)   return `<span class="dd-soon">${dd} (D-${diff})</span>`;
  return`${dd} <span style="color:#aaa;font-size:11px">(D-${diff})</span>`;
}

  const s=document.getElementById("fStatus").value;
  const m=document.getElementById("fMonth").value;
  const q=document.getElementById("fSearch").value.toLowerCase();
  const v=document.getElementById("fVendor").value;
  cur=D.filter(d=>{
    const stMatch = !s || d.st===s || (s==="입고완료" && d.st==="재고(사용가능)") || (s==="발주완료(입고예정)" && d.st==="발주완료");
    const dayMatch = !dayFilter || d.dd === dayFilter || (d.dd_original||"") === dayFilter;
    return (!p||d.pj===p) && stMatch && (!m||d.dd.startsWith(m)) && (!q||d.sp.toLowerCase().includes(q)) && (!v||d.vd===v) && dayMatch;
  });
  pgn=1;doSort();
  updateMiniStat();
  renderDayFilterBar();
}

// 미입고/입고완료 칩 - 선택된 프로젝트 기준 (상태/월/업체/검색/날짜 필터는 무시)
function updateMiniStat(){
  const ms = document.getElementById("mini-stat");
  const p  = document.getElementById("fProj").value;
  const ST_COLOR = {"입고완료":"#3B6D11","발주완료":"#185FA5","재고(창고대기)":"#854F0B","발주예정":"#555","미입고":"#C0392B"};
  const ST_LABEL = {"입고완료":"✅ 입고완료","발주완료":"🔵 발주완료","재고(창고대기)":"🟡 재고(창고대기)","발주예정":"⚪ 발주예정","미입고":"🔴 미입고"};
  const scope = p ? D.filter(d => d.pj === p) : D;
  const cnt = {};
  scope.forEach(d => { cnt[d.st] = (cnt[d.st]||0)+1; });
  const merged = {};
  Object.entries(cnt).forEach(([k,v]) => {
    const key = k==="재고(사용가능)" ? "입고완료" : k;
    merged[key] = (merged[key]||0)+v;
  });
  merged["미입고"] = (merged["발주완료"]||0)+(merged["재고(창고대기)"]||0)+(merged["발주예정"]||0);
  const order = ["발주완료","입고완료","재고(창고대기)","발주예정","미입고"];
  const scopeLabel = p ? `<span style="font-size:11px;color:#888;margin-right:4px">[${p.replace("SDIHU 3L SIDE TAP 충방전기","SDIHU 3L").replace("SDIHU SIDE TAP IROCV","SDIHU IROCV")}]</span>` : "";
  ms.innerHTML = scopeLabel + order.filter(k=>merged[k]).map(k=>
    `<span style="font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:${ST_COLOR[k]}18;color:${ST_COLOR[k]};border:1px solid ${ST_COLOR[k]}44">${ST_LABEL[k]} <b>${merged[k]}</b>건</span>`
  ).join("");
}

function sortBy(key){
  if(sortKey===key) sortAsc=!sortAsc; else {sortKey=key;sortAsc=true;}
  doSort();
}

function doSort(){
  const typeOrder = {"":0,"신작":1,"개조":2};
  cur.sort((a,b)=>{
    if(sortKey==="tp"){
      const ao=typeOrder[a.tp]??3, bo=typeOrder[b.tp]??3;
      return ao-bo;
    }
    const av=a[sortKey]||"", bv=b[sortKey]||"";
    return sortAsc?(av>bv?1:-1):(av<bv?1:-1);
  });
  render();
}

function render(){
  const st=(pgn-1)*PS;
  document.getElementById("tbody").innerHTML=cur.slice(st,st+PS).map(d=>`
    <tr>
      <td style="max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${d.pj}">${d.pj}</td>
      <td>${d.tp}</td>
      <td style="font-weight:500;white-space:nowrap">${d.pn}</td>
      <td style="color:#888;max-width:140px;overflow:hidden;text-overflow:ellipsis" title="${d.sp}">${d.sp||"-"}</td>
      <td style="white-space:nowrap">${d.mk||"-"}</td>
      <td style="white-space:nowrap">${d.vd||"-"}</td>
      <td style="text-align:right;font-weight:500">${d.dqty||"-"}</td>
      <td style="white-space:nowrap">${d.od||"-"}</td>
      <td style="white-space:nowrap">${ddColor(d.dd, d.st)}</td>
      <td>${badge(d.st)}</td>
      <td style="color:#888">${d.rm||""}</td>
    </tr>`).join("");
  const tp=Math.ceil(cur.length/PS)||1;
  document.getElementById("pinfo").textContent=`${pgn} / ${tp} 페이지`;
  document.getElementById("cnt").textContent=`총 ${cur.length}건 표시 중`;
}

function chpg(dir){const tp=Math.ceil(cur.length/PS)||1;pgn=Math.max(1,Math.min(tp,pgn+dir));render();}

// 초기화
buildProjCards(); buildWeek(); buildDay();
go();
</script>
