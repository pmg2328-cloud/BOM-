// ===== 이번주 입고예정 (월~토) + 요일 패널 =====
const DOW=[&quot;일&quot;,&quot;월&quot;,&quot;화&quot;,&quot;수&quot;,&quot;목&quot;,&quot;금&quot;,&quot;토&quot;];
function pad(n){return n&lt;10?&quot;0&quot;+n:&quot;&quot;+n;}
function fmt(d){return d.getFullYear()+&quot;-&quot;+pad(d.getMonth()+1)+&quot;-&quot;+pad(d.getDate());}
function weekDates(){
  const t=new Date(); t.setHours(0,0,0,0);
  const off=(t.getDay()+6)%7;           // 월=0
  const mon=new Date(t); mon.setDate(t.getDate()-off);
  const a=[];
  // 이번주 월~토 (0~5)
  for(let i=0;i&lt;6;i++){const d=new Date(mon); d.setDate(mon.getDate()+i); a.push(d);}
  // 다음주 월~토 (6~11) - 일요일 건너뛰고 +7부터
  for(let i=7;i&lt;13;i++){const d=new Date(mon); d.setDate(mon.getDate()+i); a.push(d);}
  return a;
}
const WK=weekDates(), TODAY=fmt(new Date());
let SEL=0; WK.forEach((d,i)=&gt;{if(fmt(d)===TODAY)SEL=i;});
function dayTotal(key){const o=DAILY[key]||{};return Object.values(o).reduce((a,b)=&gt;a+b,0);}

function buildWeek(){
  function renderBlock(start, end, title){
    let sum=0, cells=&quot;&quot;;
    for(let i=start;i&lt;end;i++){
      const d=WK[i], key=fmt(d), tot=dayTotal(key), isT=key===TODAY;
      sum+=tot;
      const lbl=DOW[d.getDay()]+&quot; &quot;+(d.getMonth()+1)+&quot;/&quot;+d.getDate()+(isT?&quot; ·오늘&quot;:&quot;&quot;);
      cells += `&lt;div class=&quot;wcell ${i===SEL?'on':''}&quot; onclick=&quot;pickDay(${i})&quot;&gt;&lt;div class=&quot;wd&quot;&gt;${lbl}&lt;/div&gt;&lt;div class=&quot;wn&quot;&gt;${tot}&lt;/div&gt;&lt;/div&gt;`;
    }
    const r0=WK[start], r1=WK[end-1];
    const range=`(${r0.getMonth()+1}/${r0.getDate()}~${r1.getMonth()+1}/${r1.getDate()})`;
    return `&lt;div class=&quot;week-head&quot;&gt;&lt;span&gt;&lt;b&gt;${title}&lt;/b&gt; &lt;span style=&quot;color:#999;font-weight:400&quot;&gt;${range}&lt;/span&gt;&lt;/span&gt;&lt;span style=&quot;color:#666&quot;&gt;합계 ${sum}건&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;week-row&quot;&gt;${cells}&lt;/div&gt;`;
  }
  document.getElementById(&quot;week-content&quot;).innerHTML =
    renderBlock(0, 6, &quot;이번주 입고예정&quot;)
    + `&lt;div style=&quot;height:12px&quot;&gt;&lt;/div&gt;`
    + renderBlock(6, 12, &quot;다음주 입고예정&quot;);
}

function buildDay(){
  const d=WK[SEL], key=fmt(d), o=DAILY[key]||{}, tot=dayTotal(key), isT=key===TODAY;
  let rows;
  if(tot===0){
    rows=`&lt;div class=&quot;drow&quot; style=&quot;color:#999;justify-content:center&quot;&gt;입고예정 없음&lt;/div&gt;`;
  } else {
    rows=PORDER.map(p=&gt;{
      const v=o[p]||0;
      if(v&gt;0){
        return `&lt;div class=&quot;drow drow-clickable&quot; onclick=&quot;applyDayProjFilter('${key}','${p}')&quot; title=&quot;클릭하면 ${p} ${v}건만 보기&quot;&gt;&lt;span style=&quot;color:#666&quot;&gt;${p}&lt;/span&gt;&lt;span style=&quot;font-weight:500;color:#185FA5&quot;&gt;${v}건 →&lt;/span&gt;&lt;/div&gt;`;
      } else {
        return `&lt;div class=&quot;drow&quot;&gt;&lt;span style=&quot;color:#666&quot;&gt;${p}&lt;/span&gt;&lt;span style=&quot;color:#bbb&quot;&gt;${v}건&lt;/span&gt;&lt;/div&gt;`;
      }
    }).join(&quot;&quot;);
  }
  const btn = tot&gt;0
    ? `&lt;button onclick=&quot;applyDayFilter()&quot; style=&quot;font-size:12px;font-weight:500;padding:4px 12px;border-radius:999px;border:1px solid #378ADD;background:#E8F1FB;color:#185FA5;cursor:pointer&quot;&gt;📋 이 날짜 전체 보기&lt;/button&gt;`
    : &quot;&quot;;
  document.getElementById(&quot;day-panel&quot;).innerHTML=
    `&lt;div class=&quot;day-head&quot;&gt;&lt;span style=&quot;font-weight:500;color:#185FA5&quot;&gt;${d.getMonth()+1}/${d.getDate()} (${DOW[d.getDay()]}) 입고예정${isT?' · 오늘':''}&lt;/span&gt;&lt;span style=&quot;display:flex;align-items:center;gap:10px&quot;&gt;&lt;span style=&quot;color:#666;font-size:12px&quot;&gt;합계 ${tot}건&lt;/span&gt;${btn}&lt;/span&gt;&lt;/div&gt;${rows}`;
}
function pickDay(i){SEL=i;buildWeek();buildDay();}

function badge(s){
  const m={&quot;입고완료&quot;:&quot;b-done&quot;,&quot;재고(사용가능)&quot;:&quot;b-done&quot;,&quot;발주완료&quot;:&quot;b-order&quot;,&quot;재고(창고대기)&quot;:&quot;b-swait&quot;,&quot;발주예정&quot;:&quot;b-pending&quot;};
  const label={&quot;재고(사용가능)&quot;:&quot;입고완료 (재고)&quot;,&quot;발주완료&quot;:&quot;발주완료(입고예정)&quot;};
  return`&lt;span class=&quot;badge ${m[s]||&quot;b-pending&quot;}&quot;&gt;${label[s]||s}&lt;/span&gt;`;
}

function ddColor(dd, status){
  // 입고완료 상태: 날짜가 있으면 표시, 없으면 &quot;입고완료&quot;만
  if(status === &quot;입고완료&quot; || status === &quot;재고(사용가능)&quot;) {
    if(dd &amp;&amp; dd.match(/\d{4}-\d{2}-\d{2}/)) 
      return `&lt;span style=&quot;color:#3B6D11;font-weight:500&quot;&gt;${dd} ✅&lt;/span&gt;`;
    return `&lt;span style=&quot;color:#3B6D11;font-weight:500&quot;&gt;✅ 입고완료&lt;/span&gt;`;
  }
  // 발주 상태: 예정일 기준 D-day 계산
  if(!dd||!dd.match(/\d{4}-\d{2}-\d{2}/)) return dd||&quot;-&quot;;
  const today=new Date(); today.setHours(0,0,0,0);
  const d=new Date(dd); d.setHours(0,0,0,0);
  const diff=Math.round((d-today)/(1000*60*60*24));
  if(diff &lt; 0)   return `&lt;span style=&quot;color:#fff;background:#C0392B;padding:2px 8px;border-radius:6px;font-weight:500&quot;&gt;${dd} ⚠️ ${-diff}일 지연&lt;/span&gt;`;
  if(diff === 0) return `&lt;span style=&quot;color:#fff;background:#185FA5;padding:2px 8px;border-radius:6px;font-weight:500&quot;&gt;${dd} D-DAY&lt;/span&gt;`;
  if(diff&lt;=7)    return `&lt;span class=&quot;dd-urgent&quot;&gt;${dd} (D-${diff})&lt;/span&gt;`;
  if(diff&lt;=30)   return `&lt;span class=&quot;dd-soon&quot;&gt;${dd} (D-${diff})&lt;/span&gt;`;
  return`${dd} &lt;span style=&quot;color:#aaa;font-size:11px&quot;&gt;(D-${diff})&lt;/span&gt;`;
}

  const ST_LABEL = {&quot;입고완료&quot;:&quot;✅ 입고완료&quot;,&quot;발주완료&quot;:&quot;🔵 발주완료&quot;,&quot;재고(창고대기)&quot;:&quot;🟡 재고(창고대기)&quot;,&quot;발주예정&quot;:&quot;⚪ 발주예정&quot;,&quot;미입고&quot;:&quot;🔴 미입고&quot;};
  const scope = p ? D.filter(d =&gt; d.pj === p) : D;
  const cnt = {};
  scope.forEach(d =&gt; { cnt[d.st] = (cnt[d.st]||0)+1; });
  const merged = {};
  Object.entries(cnt).forEach(([k,v]) =&gt; {
    const key = k===&quot;재고(사용가능)&quot; ? &quot;입고완료&quot; : k;
    merged[key] = (merged[key]||0)+v;
  });
  merged[&quot;미입고&quot;] = (merged[&quot;발주완료&quot;]||0)+(merged[&quot;재고(창고대기)&quot;]||0)+(merged[&quot;발주예정&quot;]||0);
  const order = [&quot;발주완료&quot;,&quot;입고완료&quot;,&quot;재고(창고대기)&quot;,&quot;발주예정&quot;,&quot;미입고&quot;];
  const scopeLabel = p ? `&lt;span style=&quot;font-size:11px;color:#888;margin-right:4px&quot;&gt;[${p.replace(&quot;SDIHU 3L SIDE TAP 충방전기&quot;,&quot;SDIHU 3L&quot;).replace(&quot;SDIHU SIDE TAP IROCV&quot;,&quot;SDIHU IROCV&quot;)}]&lt;/span&gt;` : &quot;&quot;;
  ms.innerHTML = scopeLabel + order.filter(k=&gt;merged[k]).map(k=&gt;
    `&lt;span style=&quot;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:${ST_COLOR[k]}18;color:${ST_COLOR[k]};border:1px solid ${ST_COLOR[k]}44&quot;&gt;${ST_LABEL[k]} &lt;b&gt;${merged[k]}&lt;/b&gt;건&lt;/span&gt;`
  ).join(&quot;&quot;);
}

function sortBy(key){
  if(sortKey===key) sortAsc=!sortAsc; else {sortKey=key;sortAsc=true;}
  doSort();
}

function doSort(){
  const typeOrder = {&quot;&quot;:0,&quot;신작&quot;:1,&quot;개조&quot;:2};
  cur.sort((a,b)=&gt;{
    if(sortKey===&quot;tp&quot;){
      const ao=typeOrder[a.tp]??3, bo=typeOrder[b.tp]??3;
      return ao-bo;
    }
    const av=a[sortKey]||&quot;&quot;, bv=b[sortKey]||&quot;&quot;;
    return sortAsc?(av&gt;bv?1:-1):(av&lt;bv?1:-1);
  });
  render();
}

function render(){

  document.getElementById(&quot;tbody&quot;).innerHTML=cur.slice(st,st+PS).map(d=&gt;`

      &lt;td style=&quot;white-space:nowrap&quot;&gt;${ddColor(d.dd, d.st)}&lt;/td&gt;
      &lt;td&gt;${badge(d.st)}&lt;/td&gt;
      &lt;td style=&quot;color:#888&quot;&gt;${d.rm||&quot;&quot;}&lt;/td&gt;
    &lt;/tr&gt;`).join(&quot;&quot;);
  const tp=Math.ceil(cur.length/PS)||1;
  document.getElementById(&quot;pinfo&quot;).textContent=`${pgn} / ${tp} 페이지`;
  document.getElementById(&quot;cnt&quot;).textContent=`총 ${cur.length}건 표시 중`;
}

function chpg(dir){const tp=Math.ceil(cur.length/PS)||1;pgn=Math.max(1,Math.min(tp,pgn+dir));render();}

// 초기화
buildProjCards(); buildWeek(); buildDay();
go();

(function() {
  // 표시할 업체 고정 목록 (순서 그대로 표시)
  const FIXED_VENDORS = [&quot;대아상사&quot;,&quot;현전사&quot;,&quot;동화자동화&quot;,&quot;훼스토&quot;,&quot;삼원자동화&quot;,&quot;디에스시스템&quot;,&quot;인아오리엔탈&quot;,&quot;키엔스&quot;,&quot;미스미&quot;,&quot;에스엠이앤씨&quot;];

  const stats = {};
  ALL_ITEMS.forEach(d=&gt;{
    if(!d.supplier) return;
    if(!stats[d.supplier]) stats[d.supplier] = {inStock:0, depleted:0, qty:0};
    if((d.qty||0) &gt; 0) stats[d.supplier].inStock += 1;
    else stats[d.supplier].depleted += 1;
    stats[d.supplier].qty += (d.qty||0);
  });

  const grid = document.getElementById(&quot;vendor-grid&quot;);
  FIXED_VENDORS.forEach(name=&gt;{
    const s = stats[name] || {inStock:0, depleted:0, qty:0};
    const card = document.createElement(&quot;div&quot;);
    card.className = &quot;vendor-card&quot;;
    card.setAttribute(&quot;data-supplier&quot;, name);
    card.innerHTML = `
      &lt;div class=&quot;vendor-name&quot; title=&quot;${name}&quot;&gt;${name}&lt;/div&gt;
      &lt;div class=&quot;vendor-stat&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#2e9e44&quot;&gt;&lt;/span&gt;보유품목: &lt;b&gt;${s.inStock}건&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;vendor-stat&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#C0392B&quot;&gt;&lt;/span&gt;소진품목: &lt;b style=&quot;color:#C0392B&quot;&gt;${s.depleted}건&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;vendor-stat&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#185FA5&quot;&gt;&lt;/span&gt;재고수량: &lt;b&gt;${s.qty.toLocaleString()}개&lt;/b&gt;&lt;/div&gt;
    `;
    card.onclick = ()=&gt;{
      const isActive = card.classList.contains(&quot;active&quot;);
      if(isActive) {
        filterSupplier(&quot;&quot;);
      } else {
        filterSupplier(name);
      }
    };
    grid.appendChild(card);
  });
})();

  suppliers.forEach(v=&gt;{

    const count = ALL_ITEMS.filter(d=&gt;d.supplier===v).length;

  });
})();

  document.getElementById(&quot;fSearch&quot;).value = &quot;&quot;;
  sortKey = &quot;supplier&quot;; sortAsc = true;
  filterSupplier(&quot;&quot;);
}

function showSupplierFilter() {
  document.querySelectorAll(&quot;.stat-card&quot;).forEach(el=&gt;el.classList.remove(&quot;active&quot;));
  document.getElementById(&quot;stat-suppliers&quot;).classList.add(&quot;active&quot;);
  const panel = document.getElementById(&quot;supplier-panel&quot;);
  panel.style.display = panel.style.display === &quot;none&quot; ? &quot;flex&quot; : &quot;none&quot;;
}

function filterSupplier(name) {
  document.getElementById(&quot;fSupplier&quot;).value = name;
  document.querySelectorAll(&quot;.chip&quot;).forEach(el=&gt;el.classList.remove(&quot;active&quot;));
  const chip = document.querySelector(`.chip[data-supplier=&quot;${name}&quot;]`);
  if(chip) chip.classList.add(&quot;active&quot;);
  document.querySelectorAll(&quot;.vendor-card&quot;).forEach(el=&gt;el.classList.remove(&quot;active&quot;));
  if(name) {
    const vcard = document.querySelector(`.vendor-card[data-supplier=&quot;${name}&quot;]`);
    if(vcard) vcard.classList.add(&quot;active&quot;);
  }
  go();
}

function filterByQty() {
  document.querySelectorAll(&quot;.stat-card&quot;).forEach(el=&gt;el.classList.remove(&quot;active&quot;));
  document.getElementById(&quot;stat-qty&quot;).classList.add(&quot;active&quot;);
  document.getElementById(&quot;fSupplier&quot;).value = &quot;&quot;;
  document.getElementById(&quot;fSearch&quot;).value = &quot;&quot;;
  sortKey = &quot;qty&quot;; sortAsc = false;
  go();
}

function go() {
  const s = document.getElementById(&quot;fSupplier&quot;).value;
  const q = document.getElementById(&quot;fSearch&quot;).value.toLowerCase();
  cur = ALL_ITEMS.filter(d=&gt;{
    return (!s || d.supplier===s) &amp;&amp; (!q || d.spec.toLowerCase().includes(q) || d.product.toLowerCase().includes(q));
  });
  pgn = 1; doSort();
}

function sortBy(key) {
  if(sortKey===key) sortAsc=!sortAsc; else {sortKey=key;sortAsc=true;}
  doSort();
}

function doSort() {
  cur.sort((a,b)=&gt;{
    const av=a[sortKey], bv=b[sortKey];
    if(typeof av===&quot;number&quot; &amp;&amp; typeof bv===&quot;number&quot;) return sortAsc?av-bv:bv-av;
    const as=av||&quot;&quot;, bs=bv||&quot;&quot;;
    return sortAsc?(as&gt;bs?1:-1):(as&lt;bs?1:-1);
  });
  render();
}

function esc(s) {
  return String(s||&quot;&quot;).replace(/&amp;/g,&quot;&amp;amp;&quot;).replace(/&lt;/g,&quot;&amp;lt;&quot;).replace(/&gt;/g,&quot;&amp;gt;&quot;).replace(/&quot;/g,&quot;&amp;quot;&quot;);
}

function usageCell(qty, memo) {
  const num = qty &gt; 0 ? `&lt;span class=&quot;use-num&quot;&gt;${qty.toLocaleString()}&lt;/span&gt;` : `&lt;span style=&quot;color:#ccc&quot;&gt;-&lt;/span&gt;`;
  const icon = memo ? `&lt;span class=&quot;memo&quot; title=&quot;${esc(memo)}&quot;&gt;📝&lt;/span&gt;` : &quot;&quot;;
  return num + icon;
}

function render() {
  const st=(pgn-1)*PS;
  document.getElementById(&quot;tbody&quot;).innerHTML=cur.slice(st,st+PS).map(d=&gt;`
    &lt;tr&gt;
      &lt;td style=&quot;white-space:nowrap;font-weight:500&quot;&gt;${d.supplier||&quot;-&quot;}&lt;/td&gt;
      &lt;td&gt;${d.maker||&quot;-&quot;}&lt;/td&gt;
      &lt;td style=&quot;font-weight:500&quot;&gt;${d.product||&quot;-&quot;}&lt;/td&gt;
      &lt;td style=&quot;color:#888;max-width:180px;overflow:hidden;text-overflow:ellipsis&quot; title=&quot;${esc(d.spec)}&quot;&gt;${d.spec||&quot;-&quot;}&lt;/td&gt;
      &lt;td style=&quot;text-align:right;font-weight:500&quot; class=&quot;${d.qty&lt;=0?'qty-zero':''}&quot; &gt;${d.qty.toLocaleString()}&lt;/td&gt;
      &lt;td style=&quot;text-align:right&quot;&gt;${usageCell(d.use_cur, d.memo_cur)}&lt;/td&gt;
      &lt;td style=&quot;text-align:right&quot;&gt;${usageCell(d.use_nxt, d.memo_nxt)}&lt;/td&gt;
    &lt;/tr&gt;`).join(&quot;&quot;);
  const tp=Math.ceil(cur.length/PS)||1;
  document.getElementById(&quot;pinfo&quot;).textContent=`${pgn} / ${tp} 페이지`;
  document.getElementById(&quot;cnt&quot;).textContent=`총 ${cur.length}건 표시 중`;
}

function chpg(dir) {const tp=Math.ceil(cur.length/PS)||1;pgn=Math.max(1,Math.min(tp,pgn+dir));render();}

// Init
go();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
</div>

<script>
function showTab(i, btn){
  document.querySelectorAll('.panes iframe').forEach(function(f,idx){
    f.classList.toggle('active', idx === i);
  });
  document.querySelectorAll('.tabbtn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
}
</script>
